[project]
name = "forge-agent"
version = "0.1.0"
description = "A local-first coding agent with a web control panel"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "rich>=13.0",
  "pyyaml>=6.0",
  "sympy>=1.12",
]

[project.scripts]
forge = "forge.cli:main"
forge-dash = "forge.server:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["web/*"]
